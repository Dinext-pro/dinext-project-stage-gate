# Pilot: Gitflow MR guard using dinext_control_center policy/scripts.
# Root of trust remains the Gitaly pre-receive hook; this job is audit/UX.
# Control center commit pin: 25a950698a20c71b26bda3c16b83e46e44b6da06

stages:
  - test

gitflow:mr-guard:
  stage: test
  image: alpine:3.20
  tags:
    - dinext
    - validation
    - docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apk add --no-cache bash grep git
    - |
      set -euo pipefail
      rm -rf /tmp/dinext_cc
      git clone --depth 1 \
        "${CI_SERVER_URL}/erpnext/dinext/dinext_control_center.git" /tmp/dinext_cc
      git -C /tmp/dinext_cc fetch --depth 1 origin 25a950698a20c71b26bda3c16b83e46e44b6da06 || true
      git -C /tmp/dinext_cc checkout 25a950698a20c71b26bda3c16b83e46e44b6da06 || git -C /tmp/dinext_cc checkout main
      mkdir -p "$CI_PROJECT_DIR/scripts" "$CI_PROJECT_DIR/policy"
      cp /tmp/dinext_cc/scripts/validate-mr-gitflow.sh "$CI_PROJECT_DIR/scripts/"
      cp /tmp/dinext_cc/policy/gitflow-allowlist.yaml "$CI_PROJECT_DIR/policy/"
      cp /tmp/dinext_cc/policy/legacy-denylist.yaml "$CI_PROJECT_DIR/policy/"
      chmod +x "$CI_PROJECT_DIR/scripts/validate-mr-gitflow.sh"
  script:
    - bash scripts/validate-mr-gitflow.sh
